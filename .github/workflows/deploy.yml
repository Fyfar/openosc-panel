name: Deploy to GitHub Pages

# Rebuild and publish the static site on every push to main, plus on demand.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default; only the deploy job gets the Pages/OIDC permissions, so nothing that
# runs during `npm ci` or the build can mint a deploy token.
permissions:
  contents: read

# Let a running deploy finish, but coalesce queued ones.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22 # engines: >=22.18 (type stripping, module.registerHooks)
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same gates as ci.yml on purpose: an admin push straight to main skips the PR checks,
      # and the self-checks guard bugs that are silent in the UI.
      - name: Build (typecheck + Vite)
        run: npm run build

      - name: Self-checks
        run: npm run check

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
